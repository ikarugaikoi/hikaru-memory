<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc"><title id="title">Hikaru Memory 機能フロー</title><desc id="desc">会話保存・振り返り・書き込み・更新・検索・自主活動の関係。詳細は architecture.md。</desc><rect width="1440" height="1440" fill="#f8fafb" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607487" /></marker></defs><g transform="translate(0,35)"><text x="50" y="55" font-size="32" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Hikaru Memory</text><text x="50" y="88" font-size="19" fill="#263442" font-family="system-ui, sans-serif">経験は残り、理解は変わる。ツールは構造の境界を守り、モデルが意味と応答を判断する。</text><text x="50" y="140" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">01  会話と新しい記憶</text><rect x="50" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">セッションログ</text><text x="66" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">話者・時刻・メッセージを解析</text><rect x="410" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">統合と除外の判定</text><text x="426" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">記録対象外の区間は今回の保存から除外</text><rect x="770" y="160" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">原文アーカイブ</text><text x="786" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">日別の原文・画像・出典位置</text><polyline points="350,207.5 410,207.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,207.5 770,207.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="295" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="324" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">機械的な手がかり</text><text x="66" y="350" font-size="15" fill="#263442" font-family="system-ui, sans-serif">訂正・言い淀み・再出現など</text><rect x="410" y="295" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="324" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">文脈の振り返りと再読</text><text x="426" y="350" font-size="15" fill="#263442" font-family="system-ui, sans-serif">隣接ターンを見て不確実性を残す</text><rect x="770" y="295" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="324" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">制御された書き込み</text><text x="786" y="350" font-size="15" fill="#263442" font-family="system-ui, sans-serif">言語確認・バージョン・構造・保護対象</text><polyline points="350,342.5 410,342.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,342.5 770,342.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1380,208 1410,208 1410,275 30,275 30,342 50,342" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="435" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">02  用途の違う記録を保存</text><rect x="50" y="455" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="484" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">最近の日記と未完了事項</text><text x="66" y="510" font-size="15" fill="#263442" font-family="system-ui, sans-serif">開始時に最近の文脈を読み込む</text><rect x="410" y="455" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="484" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">現在の理解と更新</text><text x="426" y="510" font-size="15" fill="#263442" font-family="system-ui, sans-serif">対象・別名・根拠・適用範囲</text><rect x="770" y="455" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="484" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">蓄積した経験</text><text x="786" y="510" font-size="15" fill="#263442" font-family="system-ui, sans-serif">層ごとの圧縮と必要な内容の保護</text><rect x="1130" y="455" width="250" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="1146" y="484" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">振り返りと内省</text><text x="1146" y="510" font-size="15" fill="#263442" font-family="system-ui, sans-serif">証拠の出所と反例</text><text x="50" y="615" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">03  必要なときに取り出す</text><rect x="50" y="635" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="664" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">開始時の読み込み</text><text x="66" y="690" font-size="15" fill="#263442" font-family="system-ui, sans-serif">現在の状態と最近の記録</text><rect x="410" y="635" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="664" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">能動ハイブリッド検索</text><text x="426" y="690" font-size="15" fill="#263442" font-family="system-ui, sans-serif">BM25 + BGE-M3 → RRF</text><rect x="770" y="635" width="300" height="108" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="664" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">共有した経験の連想</text><text x="786" y="690" font-size="15" fill="#263442" font-family="system-ui, sans-serif">別名 → 前回の区間</text><text x="786" y="712" font-size="15" fill="#263442" font-family="system-ui, sans-serif">頻度と集中度でトリガーを選別</text><rect x="1130" y="635" width="250" height="108" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="1146" y="664" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">理解の更新注記</text><text x="1146" y="690" font-size="15" fill="#263442" font-family="system-ui, sans-serif">登録済みの古い記述に</text><text x="1146" y="712" font-size="15" fill="#263442" font-family="system-ui, sans-serif">後の理解を添える</text><polyline points="320,550 320,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="800" width="1330" height="85" rx="12" fill="#e8edf9" stroke="#88aaa6" /><text x="66" y="829" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">モデルの現在のコンテキスト</text><text x="66" y="855" font-size="15" fill="#263442" font-family="system-ui, sans-serif">対象・時刻・出典・範囲を確認。使わなくても、さらに調べてもよい。</text><polyline points="200.0,730 200.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560.0,730 560.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920.0,743 920.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1255.0,743 1255.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="945" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">04  任意の自主活動</text><rect x="50" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">活動時間帯と資料</text><text x="66" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">明示的に設定してから有効化</text><rect x="410" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">実際の活動記録</text><text x="426" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">何を読み、何をしたか、進捗</text><rect x="770" y="965" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">内省と索引</text><text x="786" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">証拠の出所を確認し、言い換えを新たな証拠にしない</text><polyline points="350,1012.5 410,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,1012.5 770,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="1122" font-size="16" fill="#536477" font-family="system-ui, sans-serif">振り返りと書き込みから複数の記録が生まれる。分岐・更新・圧縮の詳細は architecture.md を参照。</text><polyline points="1075,390 1075,414 320,414 320,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 560,414 560,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 920,414 920,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 1255,414 1255,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="410" y="568" width="670" height="40" rx="8" fill="#edf2f4" stroke="#88aaa6" /><text x="425" y="594" font-family="system-ui,sans-serif" font-size="16" fill="#263442">再構築可能なカタログ・索引：原文・対象別名・振り返り・経験・活動記録</text><polyline points="560,550 560,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920,550 920,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1255,550 1255,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560,608 560,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920,608 920,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560,550 560,558 1105,558 1105,620 1255,620 1255,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /></g></svg>
