<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc"><title id="title">Hikaru Memory 功能流程</title><desc id="desc">对话归档、复盘、写入、修订、检索和自主活动的关系。详细流程见 architecture.md。</desc><rect width="1440" height="1440" fill="#f8fafb" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607487" /></marker></defs><g transform="translate(0,35)"><text x="50" y="55" font-size="32" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Hikaru Memory</text><text x="50" y="88" font-size="19" fill="#263442" font-family="system-ui, sans-serif">经历留下来，理解可以改变；工具守住结构边界，模型判断含义与回应。</text><text x="50" y="140" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">01  对话与新记忆</text><rect x="50" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">会话日志</text><text x="66" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">身份、时间与消息解析</text><rect x="410" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">合并与排除判定</text><text x="426" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">私密区间不进入本次归档</text><rect x="770" y="160" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="189" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">原始档案</text><text x="786" y="215" font-size="15" fill="#263442" font-family="system-ui, sans-serif">按日原文、图片与来源位置</text><polyline points="350,207.5 410,207.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,207.5 770,207.5" fill="none" stroke="#607487" s