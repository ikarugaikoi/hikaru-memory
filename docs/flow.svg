t-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">修订注记</text><text x="1146" y="690" font-size="15" fill="#263442" font-family="system-ui, sans-serif">登记旧说法的</text><text x="1146" y="712" font-size="15" fill="#263442" font-family="system-ui, sans-serif">后来理解</text><polyline points="320,550 320,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="800" width="1330" height="85" rx="12" fill="#e8edf9" stroke="#88aaa6" /><text x="66" y="829" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">模型当前上下文</text><text x="66" y="855" font-size="15" fill="#263442" font-family="system-ui, sans-serif">核对对象、时间、来源与范围；可以不用，也可以继续查证。</text><polyline points="200.0,730 200.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560.0,730 560.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920.0,743 920.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1255.0,743 1255.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="945" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">04  可选自主活动</text><rect x="50" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">活动时段与材料</text><text x="66" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">明确配置后启用</text><rect x="410" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">真实活动足迹</text><text x="426" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">读了什么、做了什么、进度</text><rect x="770" y="965" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="994" font-size="20" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">反思与索引</text><text x="786" y="1020" font-size="15" fill="#263442" font-family="system-ui, sans-serif">源头去重，复述不算新证据</text><polyline points="350,1012.5 410,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,1012.5 770,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="1122" font-size="16" fill="#536477" font-family="system-ui, sans-serif">总览中的复盘与写入会产生多种记录；完整分支、修订与压缩流程见 docs/architecture.md。</text><polyline points="1075,390 1075,414 320,414 320,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 560,414 560,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 920,414 920,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 1255,414 1255,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="410" y="568" width="670" height="40" rx="8" fill="#edf2f4" stroke="#88aaa6" /><text x="425" y="594" font-family="system-ui,sans-serif" font-size="16" fill="#263442">可重建目录与索引：原文、对象别名、复盘、经历和活动足迹</text><polyline points="560,550 560,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920,550 920,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1255,550 1255,557 745,557 745,568" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560,608 560,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920,608 920,635" fill="none" stroke="#607487" stroke-width="2" marker-end="u