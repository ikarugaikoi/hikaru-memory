<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc"><title id="title">Hikaru Memory functional flow</title><desc id="desc">Archiving, review, writing, revision, retrieval, and autonomous activity. See architecture.md.</desc><rect width="1440" height="1440" fill="#f8fafb" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607487" /></marker></defs><g transform="translate(0,35)"><text x="50" y="55" font-size="32" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Hikaru Memory</text><text x="50" y="88" font-size="19" fill="#263442" font-family="system-ui, sans-serif">Experiences persist; understanding can change. Tools enforce structure; the model interprets and responds.</text><text x="50" y="140" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">01  Conversation and new memory</text><rect x="50" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="189" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Session logs</text><text x="66" y="215" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Parse identity, time, and messages</text><rect x="410" y="160" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="189" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Merge and exclude</text><text x="426" y="215" font-size="14" fill="#263442" font-family="system-ui, sans-serif">No-record intervals stay out</text><rect x="770" y="160" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="189" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Original archive</text><text x="786" y="215" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Daily transcripts, images, and source positions</text><polyline points="350,207.5 410,207.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,207.5 770,207.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="295" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="324" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Mechanical cues</text><text x="66" y="350" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Correction, hesitation, recurrence</text><rect x="410" y="295" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="324" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Review and reread</text><text x="426" y="350" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Check adjacent turns; keep unknowns</text><rect x="770" y="295" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="324" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Controlled writes</text><text x="786" y="350" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Language review, versions, structure, and protection</text><polyline points="350,342.5 410,342.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,342.5 770,342.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1380,208 1410,208 1410,275 30,275 30,342 50,342" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="435" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">02  Record layers</text><rect x="50" y="455" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="484" font-size="18" fill="#263442" font-family=