t-size="14" fill="#263442" font-family="system-ui, sans-serif">BM25 + BGE-M3 → RRF</text><rect x="770" y="635" width="300" height="108" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="664" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Shared-experience association</text><text x="786" y="690" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Alias → previous passage</text><text x="786" y="712" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Frequency and clumping filter</text><rect x="1130" y="635" width="250" height="108" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="1146" y="664" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Revision notes</text><text x="1146" y="690" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Later understanding of</text><text x="1146" y="712" font-size="14" fill="#263442" font-family="system-ui, sans-serif">registered earlier statements</text><polyline points="320,550 320,635" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><rect x="50" y="800" width="1330" height="85" rx="12" fill="#e8edf9" stroke="#88aaa6" /><text x="66" y="829" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Current model context</text><text x="66" y="855" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Check referent, time, source, and scope; use, ignore, or investigate further.</text><polyline points="200.0,730 200.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="560.0,730 560.0,765.0 715.0,765.0 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="920.0,743 920.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1255.0,743 1255.0,771.5 715.0,771.5 715.0,800" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="945" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">04  Optional autonomous activity</text><rect x="50" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="66" y="994" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Activity windows and material</text><text x="66" y="1020" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Enable through explicit setup</text><rect x="410" y="965" width="300" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="426" y="994" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Actual activity records</text><text x="426" y="1020" font-size="14" fill="#263442" font-family="system-ui, sans-serif">What was read, done, and completed</text><rect x="770" y="965" width="610" height="95" rx="12" fill="#e5f3f0" stroke="#88aaa6" /><text x="786" y="994" font-size="18" fill="#263442" font-family="system-ui, sans-serif" font-weight="650">Reflection and indexing</text><text x="786" y="1020" font-size="14" fill="#263442" font-family="system-ui, sans-serif">Deduplicate roots; paraphrases are not new evidence</text><polyline points="350,1012.5 410,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="710,1012.5 770,1012.5" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><text x="50" y="1122" font-size="16" fill="#536477" font-family="system-ui, sans-serif">Review and writing produce several record types. See architecture.md for branches, revisions, and compression.</text><polyline points="1075,390 1075,414 320,414 320,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,390 1075,414 560,414 560,455" fill="none" stroke="#607487" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1075,3